name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 cannot natively import the TypeScript tsdown.config.ts files,
          # so tsdown falls back to its optional `unrun` peer, which is not
          # installed — `pnpm -r build` then fails. Node 22 strips types natively.
          # (Node 20 is also deprecated on GitHub runners.)
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Fresh browser bundle probes
        run: pnpm probe:browser
